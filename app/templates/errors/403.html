{% extends "base.html" %}

{% block title %}TaskFlow: Access Forbidden{% endblock %}
{% block header_label %}TaskFlow: 403 Forbidden{% endblock %}

{% block content %}
<div class="empty-state-card" style="margin-top: 40px;">
  <div class="empty-state-icon" style="background: #fef3c7; color: #d97706;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
  </div>
  <h1 class="empty-state-title" style="font-size: 20px;">403 &mdash; Access Forbidden</h1>
  <p class="empty-state-subtitle">You do not have authorization to access or modify this resource.</p>
  <a href="{{ url_for('main.dashboard') }}" class="btn-new-task" style="width:auto; padding:0 20px; text-decoration:none; margin-top:8px;">
    Return to Dashboard
  </a>
</div>
{% endblock %}
